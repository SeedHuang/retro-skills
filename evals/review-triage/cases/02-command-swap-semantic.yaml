id: 02-command-swap-semantic
title: 执行动作替换应判为必须 review
description: 预提交脚本里的一条检查命令被换成另一条，未附带说明

input:
  prompt: |
    提交前请对工作区里尚未提交的改动做分流（只分流，不要审查内容）。

    要求：只输出有内容的分档，空的分档不要写出来。

expect:
  must_contain:
    - "必须 review"
    - "机器判不了"
  must_not_contain:
    - "纯文档"
    - "低风险"
    - "不涉及代码"
    - "不影响代码"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "必须 review"
          - "机器判不了"

context:
  repo_fixture: ../.session/eval/fixture/review-triage/command-swap-demo
  git:
    init: true
    apply_diff: review-triage/fixtures/diffs/command-swap.patch
