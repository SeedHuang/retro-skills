schema_version: v1alpha1
name: review-triage
description: review-triage 技能的装/不装行为对比

environment:
  type: none

skills:
  - source: local_path
    path: ../skills/review-triage

engine:
  name: claude_code
  model:
    provider: "{provider}"
    name: "{name}"

cases:
  files:
    - review-triage/cases/01-checkbox-mechanical.yaml
    - review-triage/cases/02-command-swap-semantic.yaml
  defaults:
    timeout_seconds: 240
    max_turns: 8

benchmark:
  enabled: true

report:
  formats:
    - json
    - html
