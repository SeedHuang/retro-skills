schema_version: v1alpha1
name: dev-workflow
description: dev-workflow 技能的装/不装行为对比（段位判断、议会插点、门与段之分、出口不齐不放行）

environment:
  type: none

skills:
  - source: local_path
    path: ../skills/dev-workflow

engine:
  name: claude_code
  model:
    provider: "{provider}"
    name: "{name}"

cases:
  files:
    - dev-workflow/cases/01-route-stage2.yaml
    - dev-workflow/cases/02-no-parliament-at-plan-gate.yaml
    - dev-workflow/cases/03-five-stages-not-six.yaml
    - dev-workflow/cases/04-refuse-skip-gate.yaml
  defaults:
    timeout_seconds: 240
    max_turns: 8

benchmark:
  enabled: true

report:
  formats:
    - json
    - html
