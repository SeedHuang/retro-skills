id: 02-no-parliament-at-plan-gate
title: 计划门不设议会
description: 直接问"计划门要不要开议会"，期望明确回答不开/无议会（用 SKILL.md 段表的原词「无议会」断言），且不许留"特殊情况可以开"的口子

input:
  prompt: |
    spec 和 testcase 都评审完了，下一步要过计划门。

    计划门这一步要不要开议会？给结论和理由。

expect:
  must_contain:
    - "计划门"
    - "无议会"
  must_not_contain:
    - "计划门要开议会"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "计划门"
          - "无议会"
