id: 03-five-stages-not-six
title: 主干是五段，计划门是门不是段
description: 陷阱题——段表有 6 行但叫"五段"，期望回答五段并点明 ②→③ 是门而非段

input:
  prompt: |
    开发工作流主干一共分几段？段表里到底几行、为什么这么数？

expect:
  must_contain:
    - "计划门"
    - "不是段"
  must_not_contain:
    - "六段"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "计划门"
          - "不是段"
