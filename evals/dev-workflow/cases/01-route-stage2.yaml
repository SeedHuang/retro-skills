id: 01-route-stage2
title: PRD 定稿后应指向 ② 技术设计，并要求 spec 与 testcase 一件齐
description: 给定 PRD 已定稿并通过评审，问"现在该进哪一段"，期望回复落在 ② 技术设计而非直接进入实现

input:
  prompt: |
    PRD 已经评审通过并定稿。现在我要开始写技术设计。

    告诉我三件事：现在该进哪一段、这一段必须产出什么、出口判据是什么。

expect:
  must_contain:
    - "技术设计"
    - "testcase"
    - "议会"
  must_not_contain:
    - "不需要议会"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "技术设计"
          - "testcase"
          - "议会"
